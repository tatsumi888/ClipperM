name: CI

# main への push では deploy.yml が同じ検証を実行してからデプロイするため、
# ここでは重ねて走らせない（同じチェックが 2 重に回るのを避ける）。
on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # v4 系は Node 20 実行で非推奨警告が出るため v5 以上を使う（v5 から node24）。
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
