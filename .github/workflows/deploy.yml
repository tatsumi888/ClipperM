name: Deploy

# main への push で Cloudflare Pages へ配信する。
# 検証を同じジョブ内で先に通すので、壊れたものが本番へ出ることはない。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 連続 push したときに古いデプロイが後から上書きしないようにする
concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      # v4 系は Node 20 実行で非推奨警告が出るため v5 以上を使う（v5 から node24）。
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      # デプロイ前のゲート。ここが落ちれば配信されない。
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build

      # Secrets の登録漏れを早期に検出する。値は出さず文字数だけ見る。
      # 実際に CLOUDFLARE_ACCOUNT_ID の未登録をこれで特定したので残してある
      # （wrangler 側のエラーは "npx failed with exit code 1" としか出ず、原因が分からない）。
      - name: Secrets が登録されているか
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "CLOUDFLARE_API_TOKEN : ${#TOKEN} 文字"
          echo "CLOUDFLARE_ACCOUNT_ID: ${#ACCOUNT} 文字"
          test -n "$TOKEN" || echo "::warning::CLOUDFLARE_API_TOKEN が空です"
          test -n "$ACCOUNT" || echo "::warning::CLOUDFLARE_ACCOUNT_ID が空です"

      # 補足: ここに `wrangler whoami` の診断ステップを置いてはいけない。
      # whoami は User → User Details → Read を要求するが、このトークンは
      # Account / Cloudflare Pages / Edit だけに絞ってある（絞れているのが正しい状態）。
      # そのため whoami は必ず失敗し、continue-on-error を付けるとジョブは緑のまま
      # 毎回 error 注釈が 2 件残る。「無視してよい赤」を常設すると、
      # 本物のエラーに気づけなくなる。

      # package.json の deploy スクリプトは使わない。
      # あちらは対話ログイン前提で、CI では wrangler-action が認証を担うため。
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=clipperm --branch=main
